name: Run E2E Tests

on: [pull_request]
jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    services:
        bitnami-postgres:
            image: "bitnami/postgresql"
            ports:
            - "5432:5432"
            env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: 1234
                POSTGRES_DB: "api-checkin"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:e2e
        env:
            JWT_SECRET: testingsecret
            DATABASE_URL: "postgresql://postgres:1234@localhost:5432/api-checkin?schema=public"